{% extends "base.html" %}{% block content %}<h1>Manage announcements</h1>
<p><a class="btn" href="/admin/new">+ New announcement</a></p>
{% for a in announcements %}<div class="card"><h3>{{ a.title }}</h3><small>#{{ a.id }} - {{ a.created_at.strftime('%Y-%m-%d %H:%M') }}</small><p>{{ a.content }}</p>
<a class="btn" href="/admin/edit/{{ a.id }}">Edit</a>
<form class="inline" method="post" action="/admin/delete/{{ a.id }}" onsubmit="return confirm('Delete?')">
<input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="danger">Delete</button></form></div>{% endfor %}
{% endblock %}
