databases:
  - name: univ-db
    plan: free              # verifier les limites actuelles sur Render avant de choisir
    databaseName: univdb
    user: univ
services:
  - type: web
    name: univ-app
    runtime: docker
    plan: free
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: univ-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false         # tu la saisis dans le dashboard Render
